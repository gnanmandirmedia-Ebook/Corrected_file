<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Flipbook</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/dflip@1.0.9/css/dflip.min.css">
    <link rel="stylesheet" href="https://unpkg.com/dflip@1.0.9/css/themify-icons.min.css">
</head>
<body>

    <div class="container">
        <h2>My Interactive Flipbook</h2>
        <div id="pdf-flipbook" class="_df_book" 
             source="your-file.pdf" 
             theme="dark">
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/dflip@1.0.9/js/dflip.min.js"></script>

    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; }
        .container { margin-top: 50px; }
        #pdf-flipbook { height: 600px; margin: 0 auto; max-width: 900px; }
    </style>
</body>
</html>
